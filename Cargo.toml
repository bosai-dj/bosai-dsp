[package]
name = "bosai-dsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Beat-synced DJ effects (echo, ping-pong, roll, gater, filter FX) with BPM-derived timing"
license = "MIT"
repository = "https://github.com/bosai-dj/bosai-dsp"
documentation = "https://docs.rs/bosai-dsp"
readme = "README.md"
keywords = ["dsp", "audio", "dj", "effects", "delay"]
categories = ["multimedia::audio"]
exclude = ["/.github"]

# No dependencies. Not a runtime one, not a dev one — the test suite uses only
# std. CI proves it by checking the dependency tree is empty.
[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# docs.rs builds independently of CI, so it gets the same rustdoc flags the docs job
# uses — otherwise a link that fails there passes here and the published docs are broken.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
